[alembic]
script_location = migrations
prepend_sys_path = .
# Nombre de los archivos de migración: fecha_idrevision_descripcion
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# La URL de la base NO se escribe acá: migrations/env.py la toma de tu .env (app/core/config.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
